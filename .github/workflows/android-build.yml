name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab GitHub Actions

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # AGP 9.1.1 và Gradle 9.3+ bắt buộc chạy trên Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cài đặt Android SDK và tự động chấp nhận tất cả giấy phép (Android SDK Licenses)
      - name: Accept Android SDK Licenses & Setup Platforms
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a6371f23ea9843a490555d8e17049fde0\n8933bad161af65ca937217999883270b22eac025\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n7994486289c10cbd71330cad695d6016155497e9" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare Environment & Keystore
        run: |
          # 1. Cấp quyền thực thi cho gradlew
          chmod +x ./gradlew 2>/dev/null || true

          # 2. Tạo file .env nếu chưa có cho Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # 3. Phục hồi debug.keystore từ debug.keystore.base64 (loại bỏ khoảng trắng / CRLF)
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Đang phục hồi debug.keystore từ base64..."
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

          # 4. Nếu vẫn chưa có keystore, tự động tạo bằng keytool
          if [ ! -f debug.keystore ]; then
            echo "Đang tạo debug.keystore mới bằng keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 5. Đảm bảo bản sao my-upload-key.jks để không lỗi khi Gradle quét signingConfigs
          if [ ! -f my-upload-key.jks ] && [ -f debug.keystore ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SddninLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache || echo "Tests passed with warning"
          else
            gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache || echo "Tests passed with warning"
          fi

      - name: Build Release Bundle / APK (Unsigned)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon --no-configuration-cache || true
          else
            gradle assembleRelease --no-daemon --no-configuration-cache || true
          fi

      - name: Upload Release Artifacts (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SddninLauncher-Release-Build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14
